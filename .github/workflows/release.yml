name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module zip
        run: python3 build.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-keepalive-*.zip
          generate_release_notes: true
